<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="lean-agent — Stateless, Constant-Context CLI Task Agent">
  <defs>
    <linearGradient id="bg-lean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c2426"/>
    </linearGradient>
    <linearGradient id="accent-lean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow-lean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid-lean" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#bg-lean)" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#grid-lean)"/>
  <ellipse cx="215" cy="160" rx="190" ry="125" fill="url(#glow-lean)"/>

  <!-- Emblem: Stateless constant-context loop + terminal prompt -->
  <g transform="translate(92, 68)">
    <rect x="0" y="0" width="184" height="184" rx="28" fill="#0f1f2e" stroke="#1e3a4a" stroke-width="2"/>
    <!-- Constant-width loop ring -->
    <path d="M 52 54 A 52 52 0 1 1 40 108" fill="none" stroke="url(#accent-lean)" stroke-width="8" stroke-linecap="round"/>
    <polygon points="34,94 49,116 26,116" fill="#34d399"/>
    <!-- Terminal prompt inside -->
    <path d="M 68 80 L 86 94 L 68 108" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="94" y1="108" x2="118" y2="108" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <!-- 300-char pill indicator -->
    <rect x="44" y="138" width="96" height="22" rx="11" fill="#0b1220" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="92" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#6ee7b7">300 CHARS</text>
  </g>

  <!-- Typography -->
  <g transform="translate(320, 114)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">lean-agent</text>
    <text x="2" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Stateless, constant-context CLI task agent powered by Claude</text>

    <!-- Feature pills -->
    <g transform="translate(0, 74)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="168" height="32" rx="16" fill="#0f292a" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="84" y="21" text-anchor="middle" fill="#6ee7b7">O(1) Context</text>

      <rect x="182" y="0" width="194" height="32" rx="16" fill="#0f2433" stroke="#06b6d4" stroke-opacity="0.45"/>
      <text x="279" y="21" text-anchor="middle" fill="#67e8f9">300-Char Notes</text>

      <rect x="390" y="0" width="212" height="32" rx="16" fill="#172033" stroke="#64748b" stroke-opacity="0.45"/>
      <text x="496" y="21" text-anchor="middle" fill="#cbd5e1">Interactive Approval</text>
    </g>
  </g>

  <!-- Right decorative token bars -->
  <g transform="translate(1030, 76)" opacity="0.85">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b">TOKENS / TURN</text>
    <rect x="0" y="14" width="110" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="14" width="54" height="10" rx="5" fill="url(#accent-lean)"/>
    <rect x="0" y="36" width="110" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="36" width="58" height="10" rx="5" fill="url(#accent-lean)"/>
    <rect x="0" y="58" width="110" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="58" width="55" height="10" rx="5" fill="url(#accent-lean)"/>
    <rect x="0" y="80" width="110" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="80" width="56" height="10" rx="5" fill="url(#accent-lean)"/>
    <rect x="0" y="102" width="110" height="10" rx="5" fill="#1e293b"/>
    <rect x="0" y="102" width="54" height="10" rx="5" fill="url(#accent-lean)"/>
    <text x="0" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34d399">flat cost curve</text>
  </g>
</svg>
