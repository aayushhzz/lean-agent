[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-agent"
version = "0.1.0"
description = "Stateless, constant-context CLI task agent that keeps progress in a 300-char notes buffer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lean-agent = "lean_agent:main"

[tool.setuptools]
py-modules = ["lean_agent"]
